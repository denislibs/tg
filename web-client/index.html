<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- type не указан намеренно: при новых уведомлениях client/appBadge подменяет
         href на PNG data-URL (tweb setFavicon), и жёсткий type="image/svg+xml"
         противоречил бы содержимому. -->
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light">
    <title>Telegram</title>
    <!-- react-scan: версия запинена — npm-тег latest (0.5.7) несёт устаревший
         react-grab и сыпет ворнинг; 1.2.0 свежее самого тега -->
    <!-- <script
            crossOrigin="anonymous"
            src="//unpkg.com/react-scan@1.2.0/dist/auto.global.js"
    ></script> -->
  </head>
  <!-- Классы <body> как в tweb (index.html:41 + appImManager.ts:2209-2211):
       animation-level-2 — гейт CSS-анимаций портированных партиалов (миксин
       animation-level), переключение по настройке reduceMotion — фаза 7;
       rounded-sections — из разметки tweb, живой DOM его подтверждает;
       has-horizontal-folders — папки табами над списком (а не вертикальной
       колонкой): от него зависит показ .folders-tabs-scrollable;
       has-auth-pages — как в tweb стоит статически в HTML; снимается
       AuthFlow/Shell после doubleRaf() (bootstrapIm.ts:60-61), пока не снят —
       глушит transition .main-column (styles/tweb/pages/_chats.scss). -->
  <body class="rounded-sections animation-level-2 has-horizontal-folders has-auth-pages">
    <div id="root"></div>
    <!-- Маунт сториз-вьюера — как в tweb (public/index.html:115): отдельный узел
         в конце body, в него портируется StoryViewer. На id завязаны стили tweb
         (`_autocompleteHelper.scss`: `#stories-viewer &.is-visible.forwards`). -->
    <div id="stories-viewer"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
