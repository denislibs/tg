         href на PNG data-URL (tweb setFavicon), и жёсткий type="image/svg+xml"
         противоречил бы содержимому. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Оба мета-тега ведёт рантайм темы (core/theme/themeController.ts::setTheme /
         setThemeColor), как в tweb (public/index.html:16-17 + themeController.ts:254,324):
         color-scheme красит нативный хром браузера (скроллбары, контролы),
         theme-color — адресную строку/полосу статуса PWA. -->
    <meta name="theme-color" content="#ffffff">
    <meta name="color-scheme" content="light">
    <title>Telegram</title>

    <!-- <script

       animation-level), переключение по настройке reduceMotion — фаза 7;
       rounded-sections — из разметки tweb, живой DOM его подтверждает;
       классов режима папок (горизонтальный ряд / вертикальная колонка) здесь
       нет, как и у tweb: их ставит эффект stores/foldersSidebar.solid.ts
       (порт tweb stores/foldersSidebar.ts:90-112) — ряд вкладок всегда в DOM,
       и показ .folders-tabs-scrollable решает только этот класс;

       глушит transition .main-column (styles/tweb/pages/_chats.scss). -->
