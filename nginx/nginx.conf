worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  # Access-лог БЕЗ query-строки: дефолтный combined пишет $request (полный URI с
  # query), из-за чего ?token= (сессионный/медиа-токен на /media, /ws) оседал в
  # логах. $uri — только путь. (bot/QR-токены в пути маскирует бэкенд-логгер.)
  log_format noquery '$remote_addr - [$time_local] "$request_method $uri" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log noquery;

  # --- Static compression (gzip; brotli would need a custom nginx build) ---
  gzip              on;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_vary         on;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json application/xml
    application/wasm image/svg+xml font/woff font/woff2;

  # WebSocket upgrade plumbing
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Rate-limit zone for auth endpoints (brute-force protection): 5 req/min per IP.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  # QR login is a POLLING flow, not a credential guess: the client rotates the
  # token every 30s and asks its status every 2s (~31 req/min). Sharing the 5r/m
  # bucket above meant the very first /auth/qr/new could be refused and the code
  # never appeared at all. Separate, looser zone — brute-forcing a 32-byte random
  # token is not a threat this limit could address anyway.
  limit_req_zone $binary_remote_addr zone=authqr:10m rate=60r/m;

  # Страна по IP для экрана входа — не угадывание секрета, а справочный GET,
  # который клиент шлёт на КАЖДОМ открытии экрана (и на каждой перезагрузке
  # вкладки). Под 5r/m выше он молча отваливался бы 429-ми, и поле страны
  # оставалось бы пустым. Отдельная щадящая зона; отдаётся только ISO-код.
  limit_req_zone $binary_remote_addr zone=authgeo:10m rate=30r/m;

  # HTTP->HTTPS target: prod (standard ports) keeps $host (→ :443); local dev
  # stacks publish HTTPS on a non-standard port, so map their http host:port to
  # the matching https port. (nginx >=1.11 interpolates variables in map values.)
  map $http_host $https_redirect {
    default            https://$host$request_uri;
    "localhost:38080"  https://localhost:38443$request_uri;   # verify stack
    "localhost:8080"   https://localhost:8443$request_uri;    # main compose
  }

  upstream backend {
    server backend:8080;
  }

  # --- HTTP -> HTTPS redirect ---
  server {
    listen 80;
    return 301 $https_redirect;
  }

  # --- HTTPS (terminates TLS; proxies plain http/ws to backend over the
  #     internal docker network) ---
  server {
    listen 443 ssl;
    http2  on;

    ssl_certificate     /etc/nginx/certs/dev.pem;
    ssl_certificate_key /etc/nginx/certs/dev-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root   /usr/share/nginx/html;   # the vite `dist` (bind-mounted from the host)
    index  index.html;

    client_max_body_size 100m;

    # --- Security headers (SEC-5) --- применяются к SPA-ответам (location / их
    #     наследует). nginx СБРАСЫВАЕТ унаследованные add_header в любом location
    #     со своим add_header, поэтому в = /index.html и /assets/ повторены ниже.
    #     CSP: script/style 'unsafe-inline' нужны инлайн-скрипту темы в index.html
    #     и стилям Vite; 'wasm-unsafe-eval' — WASM lottie; blob:/data: — медиа и
    #     воркеры; frame-src https: — mini-app iframes; object-src none,
    #     base-uri self, frame-ancestors none закрывают кликджекинг/инъекции.
    #     Ужесточение script-src (nonce/hash вместо unsafe-inline) — отдельно.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.jsdelivr.net; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp always;

    # --- QR login: own bucket (longer prefix wins over /api/auth/) ---
    location /api/auth/qr/ {
      limit_req         zone=authqr burst=20 nodelay;
      limit_req_status  429;
      proxy_pass         http://backend/auth/qr/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Страна по IP: own bucket (exact match wins over /api/auth/) ---
    location = /api/auth/nearest_country {
      limit_req         zone=authgeo burst=10 nodelay;
      limit_req_status  429;
      proxy_pass         http://backend/auth/nearest_country;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Auth endpoints: rate-limited (longer prefix wins over /api/) ---
    location /api/auth/ {
      limit_req         zone=auth burst=5 nodelay;
      limit_req_status  429;
      proxy_pass         http://backend/auth/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- REST API -> backend (strip the /api/ prefix; backend serves at root) ---
    location /api/ {
      proxy_pass         http://backend/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- WebSocket -> backend (long-lived; wss terminates here) ---
    location /ws {
      proxy_pass         http://backend/ws;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection $connection_upgrade;
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # --- Встроенные lottie-ассеты (обезьянки/уточки): СТАБИЛЬНЫЕ имена, БЕЗ
    #     хеша (`public/assets/tgs/<LottieAssetName>.json`, программа «один
    #     движок lottie»). Более длинный префикс (`/assets/tgs/`) выигрывает у
    #     `/assets/` ниже независимо от порядка объявления — нельзя раздавать
    #     их той же `immutable`-веткой: у пользователя с прогретым кешем
    #     обновлённый/дозалитый файл (например `ReactionGeneric.json`) не
    #     доедет год. Короткий TTL + ревалидация (nginx сам ставит
    #     ETag/Last-Modified) — компромисс между «не долбить сеть на каждый
    #     показ обезьянки» и «правка долетает быстро».
    location /assets/tgs/ {
      try_files $uri =404;
      access_log off;
      add_header Cache-Control "public, max-age=300, must-revalidate";
      add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Hashed build assets: cache aggressively (filenames are content-hashed) ---
    location /assets/ {
      try_files $uri =404;
      access_log off;
      expires    1y;
      add_header Cache-Control "public, immutable";
      # add_header здесь сбрасывает унаследованные — повторяем nosniff для JS/CSS.
      add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Публичная страница-превью @username (аналог t.me) -> backend ---
    location ~ ^/@ {
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- SPA: serve files, fall back to index.html for client-side routes ---
    location / {
      try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached (it references the latest hashed assets)
    location = /index.html {
      add_header Cache-Control "no-cache";
      # add_header здесь сбрасывает унаследованные — повторяем security-заголовки
      # на самом документе (где CSP и решает).
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Frame-Options "DENY" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header Content-Security-Policy $csp always;
    }
  }
}
