# Защита relay — общая для всех запусков coturn (корневой docker-compose.yml, стенд, прод):
# подключается `-c /etc/coturn/turnserver.conf`. В командной строке остаётся только то, что
# зависит от окружения: секрет, пул портов (он же проброс портов compose), total-quota (меньше
# пула), разрешённый адрес самого coturn.
#
# Владелец кредов — любой зарегистрированный пользователь (GET /calls/ice), поэтому relay —
# это UDP-прокси с адреса сервера, и каждое ограничение ниже обязательно.

no-cli
fingerprint

# Только UDP-relay. Не снимать: без него TURN-клиент открывает TCP к любому разрешённому пиру
# (RFC 6062), а TCP-сервисы — redis, postgres, minio, HTTP метаданных облака.
no-tcp-relay
no-multicast-peers

# Квота — в аллокациях, не в портах; считается по части имени кредов после двоеточия
# (`<expiry>:<userID>`, userdb.c::get_real_username). Сторона pc держит 2 × (сетевые интерфейсы,
# на которых браузер собирает кандидатов) аллокаций — по одной на TURN-URL udp и tcp из
# /calls/ice; на стенде 4. При 4 на pc квота 32 — это 8 pc, mesh до 9 участников; с VPN и
# виртуальными адаптерами меньше. Сверх квоты coturn отвечает 486, pc не соединяется.
# Аллокации упавшей вкладки держат квоту 600 с: libwebrtc не шлёт LIFETIME, и coturn ставит
# дефолт 600 мимо max-allocate-lifetime (ns_turn_msg.c::stun_adjust_allocate_lifetime).
user-quota=32
# Полоса на аллокацию, байт/с в каждую сторону: 500000 = 4 Мбит/с — потолок видео libwebrtc
# (2,5 Мбит/с) с Opus, RTX и пробами BWE; coturn режет посекундно, излишек отбрасывает.
max-bps=500000

# Пиры во внутренних и служебных диапазонах запрещены: иначе TURN-клиент ходит в сеть compose
# и хоста. Кроме частных — CGNAT 100.64/10 (метаданные облака 100.100.100.200, оверлей-сети),
# benchmark 198.18/15 (fake-IP прокси), IPv6 link-local, IPv4-mapped, NAT64 и 6to4: через
# IPv6-релей (coturn поднимает его и на ::1) они ведут в те же IPv4-адреса.
# НЕ добавлять `denied-peer-ip=::` — coturn читает нулевой адрес как «весь диапазон»
# (ns_turn_ioaddr.c::ioa_addr_in_range) и запрещает всех пиров; нулевой адрес и без того
# отвергается (ns_turn_server.c::good_peer_addr). Проверка после правок — coturn/smoke.sh.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=64:ff9b:1::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
